# A blank issue stays available: not every report fits a template, and a
# forced template is how a real report gets abandoned halfway.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/maestrolabs-hq/maestro-core/security/advisories/new
    about: Report privately through a security advisory, never a public issue.
  - name: Question or discussion
    url: https://github.com/orgs/maestrolabs-hq/discussions
    about: How something works, or whether it should work that way.
