# Checks that do not care what language the repository is written in.
#
# They were inside rust-fast.yml, which was fine while Rust was the only
# language. A second language would have meant a second copy of each, so they
# move here before that happens rather than after.

name: Common fast

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # Full history, not the diff: a secret committed and later removed is still
  # published.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact --verbose .

  # Prose has no compiler. This is the compiler.
  #
  # The rules live in this repository rather than in each caller, because the
  # leak they exist to stop happened exactly the other way: one repository
  # carried the rule, a sibling named a sink implementation in three files,
  # and nothing looked. A rule that guards only its own repository guards the
  # one place least likely to break it.
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestrolabs-hq/.github
          path: .shared-policy
          persist-credentials: false
      - name: No banned wording
        run: |
          set -uo pipefail
          status=0
          while IFS=$'\t' read -r term reason; do
            case "$term" in ''|\#*) continue ;; esac
            # Whole word, case-insensitive, tracked files only, and never the
            # rules file itself or the checkout it came from.
            # Markdown we wrote, and nothing else.
            #
            # Not source: code that builds ~/.some-tool/config.json is naming a
            # real path on a real disk, and renaming it breaks the thing it
            # addresses.
            #
            # Not config/: that is captured third-party state. An inventory
            # that will not name what it inventories is not an inventory.
            # Provider names and the provider's internal vocabulary are allowed
            # only where the estate documents that provider-facing boundary.
            #
            # Not DESIGN.md: a DESIGN.md dropped into a project verbatim is a
            # brand's own captured design vocabulary, the same category as
            # config/. Naming a brand's UI component -- Vercel's
            # "ex-cart-drawer" -- is not the estate borrowing a sink's storage
            # model; it is the component the brand named, captured as it
            # exists upstream.
            exclusions=()
            case "$term" in
              mempalace|codegraphcontext|graphify|wing|drawer)
                exclusions=(
                  ':!docs/providers/**'
                  ':!docs/skills/**'
                  ':!docs/tools/**'
                )
                ;;
            esac
            hits=$(git grep -nIwiE -- "$term" \
              -- '*.md' ':!.shared-policy' ':!prose-rules.txt' ':!config/' ':!DESIGN.md' \
              "${exclusions[@]}" || true)
            if [ -n "$hits" ]; then
              status=1
              printf '::error::banned wording "%s" -- %s\n' "$term" "$reason"
              printf '%s\n' "$hits" | sed 's/^/    /'
            fi
          done < .shared-policy/prose-rules.txt
          if [ "$status" -eq 0 ]; then echo "No banned wording."; fi
          exit "$status"

  # Every file says what it is for, in the first thing you read.
  #
  # A reader arriving cold gets the reason the file exists before its first
  # line of content. Rust uses //!, everything else uses a leading comment.
  #
  # Not `missing_docs`: that wants a line above every public field, which
  # produces "/// The key." over `key: String` and teaches people that doc
  # comments are a tax. The brief is where the reasoning goes.
  #
  # Language-agnostic, so it lives here rather than in rust-fast. Cargo.toml
  # and rust-toolchain.toml were the files that proved the point: both sat
  # beside clippy.toml and deny.toml, which had briefs, and neither did --
  # because the gate that existed only read .rs.
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every file opens with a brief
        run: |
          set -uo pipefail
          bare=$(git ls-files \
              '*.rs' '*.toml' '*.sh' 'justfile' '*.just' \
              '.github/workflows/*.yml' '.github/ISSUE_TEMPLATE/*.yml' \
            | while read -r f; do
              [ -f "$f" ] || continue
              case "$f" in
                # Captured third-party state and generated manifests are not
                # ours to annotate.
                config/*|*.lock) continue ;;
              esac
              case "$f" in
                *.rs) grep -qE '^//!' "$f" || echo "$f" ;;
                *)    awk 'NF{print;exit}' "$f" | grep -qE '^[[:space:]]*#' || echo "$f" ;;
              esac
            done)
          if [ -n "$bare" ]; then
            echo "::error::these files do not say what they are for"
            printf '%s\n' "$bare" | sed 's|^|    |'
            echo
            echo "Open each with a comment: what it does, and why it exists."
            echo "Rust uses //! ; everything else uses #."
            exit 1
          fi
          echo "Every file explains itself."

  # 3,200 lines of Markdown across the estate, and nothing read any of it.
  #
  # Prose has no compiler, so a broken table or an unlabelled fence ships
  # silently. Both happened here in a single afternoon.
  #
  # The rule set is in this repository, not the caller, and it is not the
  # default one: run unconfigured, markdownlint produced 203 findings of which
  # 9 were real, the rest being objections to the deliberately centred README.
  # A gate that reports 194 false positives is a gate people learn to ignore.
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestrolabs-hq/.github
          path: .shared-policy
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # config/ is captured third-party state -- skill files and tool
      # documentation written by someone else. Reformatting it would defeat
      # the point of capturing it verbatim. A DESIGN.md is the same case: a
      # brand's design vocabulary, dropped into a project exactly as the
      # upstream collection wrote it, so reformatting it would defeat
      # capturing it verbatim too.
      - run: >
          npx --yes markdownlint-cli2@0.18.1
          --config .shared-policy/.markdownlint.jsonc
          "**/*.md" "!node_modules" "!.shared-policy" "!config" "!DESIGN.md"

  # One TOML style across the estate.
  #
  # cargo already rejects a malformed manifest, so this is about shape rather
  # than validity: a repository whose Cargo.toml is formatted differently makes
  # every diff against it noisier than it needs to be.
  toml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestrolabs-hq/.github
          path: .shared-policy
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: taplo-cli
      - name: TOML is formatted
        run: |
          set -uo pipefail
          files=$(git ls-files '*.toml' | grep -v '^config/' || true)
          if [ -z "$files" ]; then echo "No TOML."; exit 0; fi
          # shellcheck disable=SC2086
          taplo fmt --config .shared-policy/taplo.toml --check --diff $files

  # The rule three repositories claimed and none enforced.
  #
  # AGENTS.md said "no absolute paths anywhere -- a test fails on this", and
  # CONTRIBUTING said both prose rules were mechanical. Only the English one
  # was. The path rule was a sentence for as long as anyone had been reading
  # it, which is the specific way a documented gate rots: it is quoted in
  # reviews, believed, and never run.
  #
  # What it looks for is a path anchored to one person's machine, because that
  # is the failure maestro-core ADR-0001 records -- a path that works where it
  # was authored and nowhere else.
  #
  # Deliberately not flagged: /usr, /opt, /etc, /var, /tmp. Those name a
  # platform convention rather than a machine, they appear in shebangs and in
  # install steps that are correct, and a gate that fails on `#!/bin/sh`
  # teaches people to skip it.
  #
  # This file is excluded because it contains the patterns themselves, the
  # same reason the prose gate excludes prose-rules.txt.
  no-absolute-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No path names one machine
        run: |
          set -uo pipefail
          hits=$(git grep -nIE -- \
            '(/home/[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+|/root/|[A-Za-z]:\\Users\\|%USERPROFILE%)' \
            -- ':!config/' ':!*.lock' ':!.github/workflows/common-fast.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::these paths are anchored to one machine"
            printf '%s\n' "$hits" | sed 's|^|    |'
            echo
            echo "Derive the path at run time instead: the home directory from"
            echo "the environment, the repository root from the working directory."
            echo "In a test, use a synthetic root such as /somewhere."
            exit 1
          fi
          echo "No path names one machine."

  # The workflows are code with access to the repository, so they are audited
  # too: unpinned actions, excessive permissions, injectable expressions.
  actions-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: zizmor@1.30.0
      # The pinning policy is one file in this repository rather than a copy in
      # each caller. Checked out rather than fetched over HTTP: the first
      # version used curl and failed on its first real run with a connection
      # reset. A gate that fails on a network blip teaches people to re-run
      # until green, which costs exactly what bypassing it would.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestrolabs-hq/.github
          path: .shared-policy
          persist-credentials: false
      - run: zizmor --config .shared-policy/zizmor.yml --persona=regular .github/workflows
