# The heavy tier: weekly and on demand.
#
# These are evidence checks, never required ruleset contexts. What matters
# instead is freshness: a heavy result older than eight days is not evidence
# of anything, and the fast tier does not cover what these do.
#
# The tier once held the Windows and macOS builds on the reasoning that
# blocking a merge on a thirty-minute matrix teaches a team to bypass its own
# gates. Measurement retired that: the matrix is minutes, not thirty, and the
# runners are unmetered, so those moved to the fast tier where a break stops
# the pull request that caused it. What belongs here is what is genuinely slow
# or genuinely periodic, which is the test this tier should have been applying
# all along.
#
# Deliberately absent, with reasons, so the gaps are decisions rather than
# oversights:
#
#   Semgrep       Python-based, which this estate avoids, and its Rust rule
#                 coverage is thin next to clippy pedantic plus CodeQL, which
#                 now analyses Rust.
#   Scheduled     CodeQL default setup already runs on its own weekly
#   CodeQL        schedule. A second one would duplicate, not verify.

name: Rust heavy

on:
  workflow_call:
    inputs:
      msrv:
        description: "Oldest Rust the crate claims to support."
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Windows and macOS moved to the fast tier, where a break blocks the pull
  # request that caused it rather than waiting for the next Monday.
  #
  # WSL stayed here, because it is a different question. At the binary level
  # WSL is Linux -- same cfg(unix), same separator -- so a fourth compile
  # target would recompile what ubuntu-latest already covers and learn
  # nothing. What is genuinely untested there is the toolchain setup: WSL
  # appends the Windows PATH to its own, and that put a broken `just` shim
  # ahead of the real binary once already. The justfile carries a comment
  # about it and no gate has ever run it.
  #
  # So this runs the task runner rather than the compiler, and it is evidence
  # rather than a gate: a WSL image takes minutes to come up, and the failure
  # it catches is environmental, not something a pull request introduces.
  wsl-toolchain:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl build-essential git
      # Deliberately the same two recipes a person runs, not equivalents. The
      # point is that `just setup` picks our toolchain rather than whatever
      # the inherited Windows PATH offers first.
      - name: The task runner works under WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --no-modify-path
          . "$HOME/.cargo/env"
          cargo install just --locked
          just setup
          just check

  # rust-toolchain.toml pins one version, so nothing else ever proves the crate
  # still builds on the oldest version it claims.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          MSRV: ${{ inputs.msrv }}
        run: |
          set -euo pipefail
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          cargo "+$MSRV" check --all-targets

  # Redundant with cargo-deny in the fast tier, on purpose: two advisory
  # sources disagree before a vulnerability is public, and the cheap time to
  # find that out is weekly rather than during an incident.
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  # Broken intra-doc links compile fine and rot silently.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  # Coverage says a line ran. Mutation says a bug on that line would have
  # failed something. It is the only check that tests the tests, which is the
  # estate's own rule -- a gate that cannot fail is not a gate -- turned on
  # the test suite itself.
  #
  # Reported, not gated. A mutation score needs a baseline before a floor
  # under it means anything, and a floor picked today would be a number
  # someone invented rather than a bar the suite has cleared.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-mutants,similarity-rs
      - run: cargo mutants --no-shuffle --timeout 120 | tee mutants.txt || true
      - name: Publish the score
        if: always()
        run: |
          {
            echo "## Mutation"
            echo
            echo '```text'
            tail -20 mutants.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Measured, published, not gated. A line-coverage floor on a toolchain that
  # reports no branch data would claim a guarantee it cannot make.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov,similarity-rs
      - run: cargo llvm-cov --all-targets --summary-only | tee coverage.txt
      - name: Publish the summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo '```text'
            cat coverage.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
