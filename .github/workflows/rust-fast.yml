# The fast tier: every pull request and every push to a protected branch.
#
# One job per check, deliberately. A single fused `quality` job cannot say
# which gate failed, and cannot be rolled out one check at a time -- both of
# which the fast tier is for. They run in parallel, so the wall clock is the
# slowest check rather than the sum.
#
# The caller owns its triggers, cadence, concurrency and permissions. A
# reusable workflow that hides those makes a repository's CI unreadable from
# the repository.

name: Rust fast

on:
  workflow_call:
    inputs:
      duplication-test:
        description: "Name of the `cargo test --test <name>` carrying the copy-paste gate."
        required: true
        type: string
      node:
        description: "Also run the Biome gates. Only for repositories holding TypeScript we own."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: similarity-rs
      - run: cargo test --all-targets
      # The copy-paste gate needs similarity-rs, so it runs here rather than
      # spawning a job whose only purpose is one more context to wait on.
      - env:
          DUPLICATION_TEST: ${{ inputs.duplication-test }}
        run: cargo test --test "$DUPLICATION_TEST"
      - if: inputs.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - if: inputs.node
        run: npm ci
      - if: inputs.node
        run: npx biome format .
      - if: inputs.node
        run: npx biome lint .

  # Licences, advisories, banned crates and sources. `machete` is here too: an
  # unused dependency is a supply-chain surface nobody is watching.
  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # Full history, not the diff: a secret committed and later removed is still
  # published.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact --verbose .

  actions-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: zizmor@1.30.0
      - run: zizmor --persona=regular .github/workflows
