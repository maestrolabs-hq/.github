# The fast tier: every pull request and every push to a protected branch.
#
# One job per check, deliberately. A single fused `quality` job cannot say
# which gate failed, and cannot be rolled out one check at a time -- both of
# which the fast tier is for. They run in parallel, so the wall clock is the
# slowest check rather than the sum.
#
# The caller owns its triggers, cadence, concurrency and permissions. A
# reusable workflow that hides those makes a repository's CI unreadable from
# the repository.
#
# Language-agnostic checks live in common-fast.yml, so a second language does
# not mean a second copy of the secret scan.

name: Rust fast

on:
  workflow_call:
    inputs:
      duplication-test:
        description: "Name of the `cargo test --test <name>` carrying the copy-paste gate."
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Every file says what it is for, in the first thing you read.
  #
  # A reader arriving at a file cold gets the reason it exists before the
  # first `use`. That is what //! is for, and rustdoc renders it as the
  # module's front page -- so the brief is not an extra artefact to maintain,
  # it is the documentation.
  #
  # Not `missing_docs`: that demands a line on every public field and variant,
  # which produces "The key." above `key: String` and teaches people that doc
  # comments are a tax. The brief is where the thinking goes.
  rust-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every module opens with a brief
        run: |
          set -uo pipefail
          missing=$(git ls-files '*.rs' | while read -r f; do
            # Skip the licence/lint preamble some crates carry, then require
            # //! before any item. `head` alone would miss a file that opens
            # with #![allow(...)].
            grep -qE '^//!' "$f" || echo "$f"
          done)
          if [ -n "$missing" ]; then
            echo "::error::these files do not say what they are for"
            printf '%s\n' "$missing" | sed 's|^|    |'
            echo
            echo "Open each with //! -- what it does, and why it exists."
            exit 1
          fi
          echo "Every module explains itself."

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: similarity-rs
      - run: cargo test --all-targets
      # The copy-paste gate needs similarity-rs, so it runs here rather than
      # spawning a job whose only purpose is one more context to wait on.
      - env:
          DUPLICATION_TEST: ${{ inputs.duplication-test }}
        run: cargo test --test "$DUPLICATION_TEST"

  # Licences, advisories, banned crates and sources. `machete` is here too: an
  # unused dependency is a supply-chain surface nobody is watching.
  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo deny check
      - run: cargo machete
